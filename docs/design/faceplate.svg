<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -55 490 460" font-family="monospace">
  <!-- 1 user unit = 1 mm. Cyberdeck faceplate + layout template. -->
  <style>
    .plate{fill:#12141c;stroke:#7aa2f7;stroke-width:1.2}
    .cut{fill:#0a0b10;stroke:#f7768e;stroke-width:1.2}
    .win{fill:#0a0b10;stroke:#9ece6a;stroke-width:1.5}
    .ref{fill:none;stroke:#565f89;stroke-width:0.8;stroke-dasharray:5 4}
    .tbd{fill:#0a0b10;stroke:#e0af68;stroke-width:1.2;stroke-dasharray:4 3}
    .amb{fill:#e0af68;font-size:7px}
    .dim{stroke:#c0caf5;stroke-width:0.4}
    .lbl{fill:#c0caf5;font-size:8px}
    .lbl small{font-size:6px}
    t,.t{fill:#c0caf5;font-size:8px}
    .hd{fill:#7aa2f7;font-size:13px;font-weight:bold}
    .sub{fill:#565f89;font-size:7px}
    .grn{fill:#9ece6a;font-size:7px}
    .red{fill:#f7768e;font-size:7px}
  </style>

  <text x="0" y="-38" class="hd">Cyberdeck faceplate — Pelican 1400 base, screen-in-lid, keyboard separate</text>
  <text x="0" y="-27" class="sub">1 unit = 1 mm · verified connector cutouts · window = measured 173×118 active area</text>

  <!-- ===== Pelican 1400 interior reference ===== -->
  <rect x="0" y="0" width="300" height="225" class="ref"/>
  <text x="150" y="240" text-anchor="middle" class="sub">Pelican 1400 interior  300 × 225 mm  (faceplate outline)</text>

  <!-- ===== Display module window (the screen module face) ===== -->
  <!-- module outline 203 x 136.5; window = MEASURED 173x118 active area, centered, bezel behind a lip -->
  <rect x="48" y="18" width="203" height="136.5" class="ref"/>
  <rect x="63" y="27.25" width="173" height="118" class="win"/>
  <text x="149" y="82" text-anchor="middle" class="grn">JUNEBOX MODULE</text>
  <text x="149" y="92" text-anchor="middle" class="sub">203×136.5×51 · Pi+SSD INSIDE</text>
  <text x="149" y="101" text-anchor="middle" class="sub">12V barrel (PP pigtail fitted) · I/O on 2 edges</text>
  <!-- VESA 75 mounting pattern (M4), for a printed bracket behind the plate -->
  <circle cx="112" cy="48.75" r="2.5" fill="none" stroke="#e0af68" stroke-width="1"/>
  <circle cx="187" cy="48.75" r="2.5" fill="none" stroke="#e0af68" stroke-width="1"/>
  <circle cx="112" cy="123.75" r="2.5" fill="none" stroke="#e0af68" stroke-width="1"/>
  <circle cx="187" cy="123.75" r="2.5" fill="none" stroke="#e0af68" stroke-width="1"/>
  <text x="149" y="140" text-anchor="middle" fill="#e0af68" font-size="6">VESA 75 · M4 · ⊞ 75×75</text>
  <!-- window dims = measured active area (the cut line) -->
  <line x1="63" y1="10" x2="236" y2="10" class="dim"/>
  <text x="149" y="8" text-anchor="middle" class="lbl">173 (active)</text>
  <line x1="258" y1="27.25" x2="258" y2="145.25" class="dim"/>
  <text x="268" y="86" text-anchor="middle" class="lbl" transform="rotate(90 268 86)">118</text>

  <!-- ===== Connector rails flank the screen: power/antenna LEFT, data RIGHT ===== -->
  <!-- Module I/O confirmed: power exits module LEFT edge, USB/data its RIGHT edge. -->

  <!-- LEFT RAIL: antenna + external power + master switch -->
  <text x="30" y="16" text-anchor="middle" class="red">LEFT RAIL</text>
  <text x="30" y="24" text-anchor="middle" class="sub">power / ant</text>
  <!-- SMA ⌀6.5 -->
  <circle cx="30" cy="45" r="3.25" class="cut"/>
  <text x="30" y="58" text-anchor="middle" class="lbl">SMA†</text>
  <text x="30" y="66" text-anchor="middle" class="sub">⌀6.5</text>
  <!-- Powerpole IN - PRINTED PP15-45 retainer, resolved 2026-09-04 (CASE.md S8 #7).
       A bonded pair presents 16 x 8.3. The round flip-cap socket (30.5 hole) does
       NOT go here - it moves to the case sidewall, where its gasket is worth
       something and shore power works lid-shut. Dashed ring = that rejected 30.5. -->
  <circle cx="30" cy="86" r="15.24" class="ref"/>
  <rect x="22" y="81.85" width="16" height="8.3" class="cut"/>
  <text x="30" y="105" text-anchor="middle" class="lbl">PP IN</text>
  <text x="30" y="113" text-anchor="middle" class="sub">16×8.3 printed</text>
  <text x="30" y="121" text-anchor="middle" class="sub">(⌀30.5 = rejected)</text>
  <!-- master switch ⌀16 — 16mm latching 5A+, ordered 2026-09-04 -->
  <circle cx="30" cy="128" r="8" class="cut"/>
  <!-- hex flange across corners 20.55 - the real rail clearance -->
  <circle cx="30" cy="128" r="10.28" class="ref"/>
  <text x="30" y="146" text-anchor="middle" class="lbl">⏻ SW</text>
  <text x="30" y="154" text-anchor="middle" class="sub">⌀16</text>

  <!-- RIGHT RAIL: USB-A x2 + Ethernet, extended off the Pi's right-edge ports -->
  <text x="277" y="16" text-anchor="middle" class="red">RIGHT RAIL</text>
  <text x="277" y="24" text-anchor="middle" class="sub">data (from Pi)</text>
  <!-- DUAL USB-A in ONE square flush-mount housing (ordered 2026-09-04).
       NOT the 2x snap-in the buy list assumed. One cutout, not two.
       Placeholder ~29 sq - MEASURE THE PART, and see CASE.md S8 #5 on the
       buckle-vs-plate-thickness trap. Dashed = not a cut file yet. -->
  <rect x="264.3" y="40" width="25.4" height="28.6" class="tbd"/>
  <text x="277" y="80" text-anchor="middle" class="lbl">USB-A ×2</text>
  <text x="277" y="88" text-anchor="middle" class="amb">flange 25.4×28.6</text>
  <text x="277" y="96" text-anchor="middle" class="amb">cutout TBD</text>
  <!-- Cat6A keystone, VERIFIED 14.6x16.2 from vendor sheet 2026-09-04.
       32.6 deep. Goes in a thin printed frame, not the 4-5mm plate. -->
  <rect x="269.7" y="128" width="14.6" height="16.2" class="cut"/>
  <text x="277" y="154" text-anchor="middle" class="lbl">RJ45</text>
  <text x="277" y="162" text-anchor="middle" class="sub">14.6×16.2 ✓</text>

  <!-- ===== Keyboard, drawn to scale, SEPARATE ===== -->
  <g transform="translate(0,300)">
    <rect x="0" y="0" width="230" height="160" class="ref"/>
    <text x="115" y="76" text-anchor="middle" class="lbl">PERIXX PERIBOARD-510H  (SEPARATE)</text>
    <text x="115" y="88" text-anchor="middle" class="sub">230 × 160 × 23 · wired USB · touchpad + 2 hubs</text>
    <text x="115" y="104" text-anchor="middle" class="red">too big to share the faceplate — stows in lid, plugs in</text>
    <line x1="0" y1="-8" x2="230" y2="-8" class="dim"/>
    <text x="115" y="-10" text-anchor="middle" class="lbl">230</text>
    <line x1="238" y1="0" x2="238" y2="160" class="dim"/>
    <text x="248" y="80" text-anchor="middle" class="lbl" transform="rotate(90 248 80)">160</text>
  </g>

  <!-- ===== Spec notes ===== -->
  <g transform="translate(270,270)" class="t">
    <text x="0" y="0" class="hd" font-size="10">Build notes</text>
    <text x="0" y="16" class="sub">• 12.8V LiFePO4 (Powerpole) → module.</text>
    <text x="0" y="27" class="sub">  NO buck, NO conversion. Cleanest path.</text>
    <text x="0" y="38" class="sub">• Panel PP IN parallels battery to bus.</text>
    <text x="0" y="49" class="sub">• Antenna = 1 SMA jack. RTL-SDR Blog</text>
    <text x="0" y="60" class="sub">  kit is all-SMA — no adapter needed.</text>
    <text x="0" y="71" class="sub">• RIGHT rail = panel-mount extensions off</text>
    <text x="0" y="82" class="sub">  the Pi's 2 USB-A + RJ45 (module R edge).</text>
    <text x="0" y="93" class="sub">• Module has its OWN fan; cooling is</text>
    <text x="0" y="104" class="sub">  handled inside. Do not block its vents.</text>
    <text x="0" y="115" class="sub">• Mount screen by its VESA 75 holes;</text>
    <text x="0" y="126" class="sub">  test-coupon every cutout first.</text>
    <text x="0" y="140" class="sub">† SMA/SDR optional — drop first if</text>
    <text x="0" y="151" class="sub">  space is tight. Deck works without.</text>
  </g>
</svg>
