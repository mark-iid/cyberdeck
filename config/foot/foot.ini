# foot — terminal for the cyberdeck.
# font size 12 (not the usual 9-10): this is a ~148 DPI panel running at scale 1,
# so glyphs are physically small. See DESIGN.md §2 on why scale 1 is forced.
font=monospace:size=12
pad=4x4

[cursor]
blink=yes

[colors]
alpha=1.0
background=1a1b26
foreground=c0caf5
